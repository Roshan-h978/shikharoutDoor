<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search - ShikaroutDoor</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- Navigation (Same as index.html) -->
    <nav class="navbar navbar-expand-lg navbar-light">
        <!-- ... existing navigation code ... -->
    </nav>

    <!-- Search Main Content -->
    <main class="search-page py-5">
        <div class="container">
            <!-- Search Header -->
            <div class="search-header mb-5">
                <h1 class="display-4 mb-3">Discover Your Style</h1>
                <div class="position-relative">
                    <form class="search-form" id="searchForm">
                        <div class="input-group">
                            <input type="search" class="form-control py-3" 
                                   placeholder="Search products, categories..." 
                                   id="mainSearch" autocomplete="off">
                            <button class="btn btn-primary px-4" type="submit">
                                <i class="fas fa-search"></i>
                            </button>
                        </div>
                        <div class="search-suggestions position-absolute w-100 bg-white shadow rounded mt-1">
                            <div class="list-group"></div>
                        </div>
                    </form>
                </div>
            </div>

            <!-- Search Filters -->
            <div class="search-filters mb-4">
                <div class="row g-3">
                    <div class="col-md-3">
                        <select class="form-select" id="categoryFilter">
                            <option value="">All Categories</option>
                            <option>Outerwear</option>
                            <option>Dresses</option>
                            <option>Accessories</option>
                        </select>
                    </div>
                    <div class="col-md-3">
                        <select class="form-select" id="priceFilter">
                            <option value="">Price Range</option>
                            <option>$0 - $100</option>
                            <option>$100 - $300</option>
                            <option>$300+</option>
                        </select>
                    </div>
                    <div class="col-md-3">
                        <select class="form-select" id="sortBy">
                            <option value="">Sort By</option>
                            <option>Newest First</option>
                            <option>Price: Low to High</option>
                            <option>Price: High to Low</option>
                        </select>
                    </div>
                    <div class="col-md-3">
                        <button class="btn btn-outline-secondary w-100" id="resetFilters">
                            <i class="fas fa-sync"></i> Reset Filters
                        </button>
                    </div>
                </div>
            </div>

            <!-- Search Results -->
            <section class="search-results">
                <div class="row g-4" id="resultsContainer">
                    <!-- Dynamic results will be inserted here -->
                    <div class="col-12 text-center py-5">
                        <div class="spinner-border text-primary" role="status">
                            <span class="visually-hidden">Loading...</span>
                        </div>
                    </div>
                </div>
            </section>
        </div>
    </main>

    <!-- Footer (Same as index.html) -->
    <footer class="footer py-5">
        <!-- ... existing footer code ... -->
    </footer>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Search functionality implementation
        document.addEventListener('DOMContentLoaded', function() {
            const searchInput = document.getElementById('mainSearch');
            const resultsContainer = document.getElementById('resultsContainer');
            const filters = {
                category: document.getElementById('categoryFilter'),
                price: document.getElementById('priceFilter'),
                sort: document.getElementById('sortBy')
            };

            // Sample product data (replace with actual API call)
            const products = [
                { id: 1, name: 'Designer Jacket', category: 'Outerwear', price: 199.99, image: 'img/jacket.jpg' },
                { id: 2, name: 'Summer Dress', category: 'Dresses', price: 89.99, image: 'img/dress.jpg' },
                { id: 3, name: 'Leather Handbag', category: 'Accessories', price: 149.99, image: 'img/bag.jpg' }
            ];

            function renderResults(filteredProducts) {
                resultsContainer.innerHTML = filteredProducts.map(product => `
                    <div class="col-lg-4 col-md-6">
                        <div class="card h-100 product-card">
                            <img src="${product.image}" class="card-img-top" alt="${product.name}">
                            <div class="card-body">
                                <h5 class="card-title">${product.name}</h5>
                                <p class="card-text text-muted">${product.category}</p>
                                <p class="text-primary h5">$${product.price.toFixed(2)}</p>
                                <button class="btn btn-primary add-to-cart" data-id="${product.id}">
                                    <i class="fas fa-shopping-cart"></i> Add to Cart
                                </button>
                            </div>
                        </div>
                    </div>
                `).join('') || '<div class="col-12 text-center py-5"><h4>No results found</h4></div>';
            }

            function performSearch() {
                const query = searchInput.value.toLowerCase();
                const category = filters.category.value;
                const priceRange = filters.price.value;
                
                // Filtering logic
                let results = products.filter(product => {
                    const matchesSearch = product.name.toLowerCase().includes(query) || 
                                        product.category.toLowerCase().includes(query);
                    const matchesCategory = !category || product.category === category;
                    const matchesPrice = !priceRange || (
                        (priceRange === '$0 - $100' && product.price <= 100) ||
                        (priceRange === '$100 - $300' && product.price > 100 && product.price <= 300) ||
                        (priceRange === '$300+' && product.price > 300)
                    );
                    
                    return matchesSearch && matchesCategory && matchesPrice;
                });

                // Sorting logic
                const sortBy = filters.sort.value;
                if(sortBy === 'Price: Low to High') results.sort((a,b) => a.price - b.price);
                if(sortBy === 'Price: High to Low') results.sort((a,b) => b.price - a.price);

                renderResults(results);
            }

            // Event Listeners
            searchInput.addEventListener('input', performSearch);
            Object.values(filters).forEach(filter => 
                filter.addEventListener('change', performSearch));
            
            document.getElementById('resetFilters').addEventListener('click', () => {
                Object.values(filters).forEach(filter => filter.value = '');
                performSearch();
            });

            // Initial load
            performSearch();
        });
    </script>

    <style>
        .search-page {
            background: #f8f9fa;
            min-height: 70vh;
        }
        .search-header {
            max-width: 800px;
            margin: 0 auto;
            text-align: center;
        }
        .search-form .form-control {
            border-radius: 50px;
            padding: 1rem 2rem;
        }
        .search-form button {
            border-radius: 0 50px 50px 0;
            padding: 1rem 2rem;
        }
        .product-card {
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            border: none;
            border-radius: 15px;
            overflow: hidden;
        }
        .product-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }
        .search-filters .form-select {
            border-radius: 50px;
            padding: 0.75rem 1.5rem;
        }
    </style>
</body>
</html>
